services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: solid-python-api
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./README.md:/app/README.md
    environment:
      - APP_ENV=development
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--app-dir", "src"]
