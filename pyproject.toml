[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solid-python-starter"
version = "0.1.0"
description = "Base de proyecto Python orientado a principios SOLID"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.54.0",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.2.3",
  "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "black>=26.5.1",
  "ruff>=0.16.9",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
exclude = ["^tests/"]
mypy_path = "src"

